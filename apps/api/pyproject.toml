[project]
name = "campus-pulse-api"
version = "0.1.0"
description = "Campus Pulse AI backend: FastAPI + LangGraph (agent arrives in M2)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.3",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "N"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake secrets in tests

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations/env.py"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a real Postgres (DATABASE_URL). Skipped when DATABASE_URL is not set.",
]
