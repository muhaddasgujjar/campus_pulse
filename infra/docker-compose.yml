# Local development (OPS-1). Run from the repo root with `make up`.
# The API connects to the DEV Supabase project through apps/api/.env (never prod).
# There is intentionally no local Postgres: tests use CI's pgvector container,
# local dev uses the dev Supabase project (Memory D5).
name: campus-pulse

services:
  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ../apps/api/.env
        required: false
    environment:
      APP_ENV: local
    # Hot reload for development: mount the code over the image copy.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    volumes:
      - ../apps/api/app:/app/app:ro

  web:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --hostname 0.0.0.0"]
    ports:
      - "3000:3000"
    env_file:
      - path: ../apps/web/.env.local
        required: false
    environment:
      # The browser runs on your machine, so it reaches the API on localhost.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - api

  # Optional local Redis instead of Upstash: `make up PROFILES=local-redis`
  # and set REDIS_URL=redis://redis:6379/0 in apps/api/.env
  redis:
    image: redis:8-alpine
    profiles: ["local-redis"]
    ports:
      - "6379:6379"

volumes:
  web_node_modules:
  web_next:
