# Run Alembic migrations against a Supabase project (session pooler URL).
# M1: manual trigger only. M6 makes this automatic on merge to main (add a `push` trigger
# on main after CI passes). Requires the repository secret DATABASE_URL_MIGRATIONS.
name: migrate

on:
  workflow_dispatch:
  # M6: enable automatic migrations on merge to main.
  # push:
  #   branches: [main]
  #   paths: ["apps/api/migrations/**"]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
    steps:
      - name: Check secret is configured
        id: guard
        run: |
          if [ -z "$DATABASE_URL_MIGRATIONS" ]; then
            echo "DATABASE_URL_MIGRATIONS secret is not set. Skipping (nothing to migrate)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
      - uses: astral-sh/setup-uv@v10
        if: steps.guard.outputs.skip != 'true'
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Alembic upgrade head
        if: steps.guard.outputs.skip != 'true'
        run: |
          uv sync --frozen --no-dev
          uv run alembic upgrade head
          uv run alembic current
